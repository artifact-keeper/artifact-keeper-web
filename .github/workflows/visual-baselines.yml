name: Update Visual Baselines

# Manually regenerate the committed visual-regression baselines.
#
# The CI "E2E Visual Regression" job (ci.yml) COMPARES against the baselines and
# must never rewrite them, otherwise it cannot fail on a real diff. When an
# intentional UI change legitimately alters a page, run this workflow against the
# branch that carries the change: it re-renders every visual snapshot on the same
# ubuntu-latest image CI uses, then commits the refreshed Linux baselines back to
# that branch. Review the resulting image diff in the commit before merging.
on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Backend image tag to render against"
        required: false
        default: "dev"

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  update-baselines:
    name: Regenerate Linux visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
        env:
          BACKEND_TAG: ${{ inputs.backend_tag }}

      - name: Regenerate baselines
        run: npx playwright test --project=visual --update-snapshots --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
          ADMIN_PASSWORD: TestRunner!2026secure

      - name: Commit refreshed Linux baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only Linux baselines are committed — CI renders on ubuntu-latest.
          git add 'e2e/suites/visual/**/*-linux.png'
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test(visual): refresh Linux baselines [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=100

      - name: Tear down E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
